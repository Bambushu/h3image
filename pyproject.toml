[project]
name = "h3edit"
version = "0.3.0"
description = "h3image: instruction-based image editing and generation on MiniMax H3 (one-frame R2V) via ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# numpy is core: the default --inpaint/--outpaint path runs the grid notch, deblock and tone match.
dependencies = ["websocket-client", "pillow", "numpy"]

[project.optional-dependencies]
score = ["scikit-image"]
autofix = ["opencv-contrib-python>=4.9"]
test = ["pytest"]

[project.scripts]
h3edit = "h3edit:main"
h3image = "h3edit:main"
h3-inpaint = "h3_inpaint:main"

[tool.setuptools]
py-modules = ["h3edit", "export_graph", "h3_inpaint"]
packages = ["h3edit_graphs"]

[tool.setuptools.package-data]
h3edit_graphs = ["*.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
